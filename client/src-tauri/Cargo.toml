[package]
name = "hamstash-client"
version = "0.8.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hamstash_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: 关闭窗口时缩到系统托盘(见lib.rs::setup_tray)
tauri = { version = "2", features = ["unstable", "tray-icon"] }
# 只允许一个客户端实例:两个前台同时操作后端/数据库会互相踩踏
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }
reqwest = { version = "0.12", features = ["json"] }
url = "2"

# 监视外置PotPlayer窗口标题用(见lib.rs::run_potplayer_title_watcher)。
# tauri本身已经间接依赖了同一个版本,声明成直接依赖不会增加实际编译量。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

